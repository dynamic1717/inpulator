<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inpulator</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="popup__header">
        <img
          class="popup__logo"
          src="../icons/icon48.png"
          alt=""
          width="28"
          height="28"
        />
        <h1 class="popup__title">Inpulator</h1>
      </header>

      <section class="popup__section" aria-labelledby="quota-label">
        <div class="popup__row">
          <span id="quota-label" class="popup__label">Лимит</span>
          <span id="quota-value" class="popup__value">… / …</span>
        </div>
        <div class="popup__meter" aria-hidden="true">
          <div id="quota-bar" class="popup__meter-bar"></div>
        </div>
      </section>

      <section class="popup__section">
        <label class="popup__toggle">
          <span class="popup__toggle-text">
            <span class="popup__label">Включить Inpulator</span>
            <span class="popup__hint">Кнопка перевода и горячая клавиша</span>
          </span>
          <input id="enabled-toggle" type="checkbox" role="switch" />
        </label>

        <label class="popup__toggle">
          <span class="popup__toggle-text">
            <span class="popup__label">Включить на этом сайте</span>
            <span id="site-toggle-hint" class="popup__hint">…</span>
          </span>
          <input id="site-toggle" type="checkbox" role="switch" />
        </label>

        <label class="popup__toggle">
          <span class="popup__toggle-text">
            <span class="popup__label">Счётчик на кнопке</span>
            <span class="popup__hint">Показывать выделено / остаток</span>
          </span>
          <input id="counter-toggle" type="checkbox" role="switch" />
        </label>
      </section>

      <section class="popup__section">
        <label class="popup__field" for="target-language-select">
          <span class="popup__toggle-text">
            <span class="popup__label">Переводить на</span>
            <span class="popup__hint">Целевой язык перевода</span>
          </span>
          <select id="target-language-select" class="popup__select"></select>
        </label>

        <fieldset class="popup__fieldset">
          <legend class="popup__label">Не переводить с</legend>
          <p class="popup__hint">Для этих языков кнопка перевода не появится</p>
          <div id="disabled-source-pills" class="popup__pills" hidden></div>
          <div id="exclude-current-row" class="popup__exclude-row" hidden>
            <span id="exclude-current-label" class="popup__exclude-label"></span>
            <button
              id="exclude-current-btn"
              type="button"
              class="popup__button popup__button--secondary"
            >
              Исключить
            </button>
          </div>
          <div id="exclude-select-row" class="popup__exclude-add">
            <select id="exclude-language-select" class="popup__select"></select>
            <button
              id="exclude-language-btn"
              type="button"
              class="popup__button popup__button--secondary"
            >
              Исключить
            </button>
          </div>
        </fieldset>
      </section>

      <section class="popup__section">
        <label class="popup__field" for="provider-select">
          <span class="popup__toggle-text">
            <span class="popup__label">Провайдер</span>
          </span>
          <select id="provider-select" class="popup__select">
            <option value="mymemory">MyMemory</option>
            <option value="chrome">Chrome</option>
            <option value="google">Google Translate</option>
          </select>
          <span id="provider-hint" class="popup__hint"></span>
        </label>

        <div id="chrome-model" class="popup__model" hidden>
          <div class="popup__row">
            <span id="chrome-model-label" class="popup__label">Языковые пакеты</span>
            <span id="chrome-model-value" class="popup__value">…</span>
          </div>
          <div id="chrome-model-meter" class="popup__meter" hidden>
            <div id="chrome-model-bar" class="popup__meter-bar"></div>
          </div>
          <p id="chrome-model-hint" class="popup__hint" hidden></p>
          <button id="chrome-model-download" type="button" class="popup__button" hidden>
            Скачать пакеты
          </button>
        </div>

        <label
          id="google-api-key-field"
          class="popup__field"
          for="google-api-key"
          hidden
        >
          <span class="popup__label">Google API key</span>
          <input
            id="google-api-key"
            class="popup__input"
            type="password"
            autocomplete="off"
            spellcheck="false"
            placeholder="Введите личный ключ"
          />
          <span id="google-api-key-hint" class="popup__hint"></span>
          <button id="google-api-key-clear" type="button" class="popup__button" hidden>
            Удалить ключ
          </button>
        </label>
      </section>
    </main>
    <script src="../languages.js"></script>
    <script src="../settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
